<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F4F8F6"/>
  <!-- Wall Background -->
  <rect x="40" y="30" width="520" height="230" rx="8" fill="#E8F1EC" stroke="#CBDDD3" stroke-width="2"/>
  <!-- Smart Digital Board -->
  <rect x="150" y="60" width="300" height="170" rx="8" fill="#004D25" stroke="#E6BE1E" stroke-width="6"/>
  <rect x="165" y="75" width="270" height="140" rx="4" fill="#033018"/>
  <text x="300" y="115" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFDF00" text-anchor="middle">Interactive Smart Learning</text>
  <text x="300" y="145" font-family="'Roboto', Arial, sans-serif" font-size="13" fill="#E6F4EA" text-anchor="middle">Activity-Based English Medium Curriculum</text>
  <!-- Geometric shapes on board -->
  <polygon points="200,165 220,195 180,195" fill="none" stroke="#66BB6A" stroke-width="2"/>
  <circle cx="250" cy="180" r="14" fill="none" stroke="#FFCA28" stroke-width="2"/>
  <rect x="350" y="165" width="45" height="25" fill="none" stroke="#42A5F5" stroke-width="2"/>

  <!-- Classroom Teacher Desk & Laptop -->
  <rect x="80" y="270" width="120" height="60" rx="4" fill="#8D6E63"/>
  <rect x="110" y="250" width="40" height="22" rx="2" fill="#37474F"/>

  <!-- Student Benches & Chairs -->
  <g fill="#A1887F" stroke="#5D4037" stroke-width="1.5">
    <!-- Row 1 Desk -->
    <rect x="250" y="280" width="140" height="40" rx="4"/>
    <rect x="260" y="255" width="40" height="25" rx="3" fill="#00612E"/>
    <rect x="330" y="255" width="40" height="25" rx="3" fill="#00612E"/>
    <!-- Row 2 Desk -->
    <rect x="420" y="280" width="140" height="40" rx="4"/>
    <rect x="430" y="255" width="40" height="25" rx="3" fill="#00612E"/>
    <rect x="500" y="255" width="40" height="25" rx="3" fill="#00612E"/>
  </g>

  <!-- Flooring -->
  <rect x="0" y="340" width="600" height="60" fill="#D7CCC8"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#BCAAA4" stroke-width="3"/>
</svg>