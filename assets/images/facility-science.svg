<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F0F7F4"/>
  <!-- Shelf with Chemical Bottles -->
  <rect x="40" y="60" width="520" height="12" fill="#8D6E63"/>
  <rect x="70" y="25" width="22" height="35" rx="3" fill="#42A5F5"/>
  <rect x="105" y="20" width="26" height="40" rx="3" fill="#66BB6A"/>
  <rect x="145" y="28" width="20" height="32" rx="3" fill="#FFA726"/>
  <rect x="440" y="22" width="24" height="38" rx="3" fill="#AB47BC"/>
  <rect x="480" y="26" width="28" height="34" rx="3" fill="#26A69A"/>

  <!-- Optical Microscope -->
  <g transform="translate(140, 140)">
    <rect x="0" y="120" width="80" height="15" rx="3" fill="#263238"/>
    <path d="M40,120 L40,40 C40,20 70,20 70,40 L70,80" fill="none" stroke="#37474F" stroke-width="12" stroke-linecap="round"/>
    <rect x="60" y="40" width="40" height="14" rx="2" fill="#E6BE1E"/>
    <line x1="75" y1="54" x2="65" y2="85" stroke="#78909C" stroke-width="8"/>
    <rect x="25" y="85" width="50" height="6" fill="#455A64"/>
  </g>

  <!-- Erlenmeyer Flask with Bubbling Fluid -->
  <g transform="translate(320, 160)">
    <path d="M40,20 L50,20 L50,45 L75,100 C80,110 70,120 60,120 L30,120 C20,120 10,110 15,100 L40,45 Z" fill="#81C784" stroke="#2E7D32" stroke-width="3"/>
    <rect x="37" y="15" width="16" height="8" rx="2" fill="#A5D6A7"/>
    <!-- Bubbles -->
    <circle cx="45" cy="85" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="55" cy="70" r="4" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="35" cy="95" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Test Tubes Rack -->
  <g transform="translate(420, 190)">
    <rect x="0" y="80" width="100" height="10" fill="#A1887F"/>
    <rect x="15" y="15" width="14" height="70" rx="7" fill="#42A5F5" opacity="0.85"/>
    <rect x="42" y="25" width="14" height="60" rx="7" fill="#FFA726" opacity="0.85"/>
    <rect x="70" y="10" width="14" height="75" rx="7" fill="#AB47BC" opacity="0.85"/>
  </g>

  <!-- Science Lab Bench Counter -->
  <rect x="0" y="280" width="600" height="120" fill="#CFD8DC"/>
  <rect x="0" y="280" width="600" height="16" fill="#37474F"/>
</svg>