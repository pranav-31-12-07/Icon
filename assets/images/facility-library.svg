<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#FAF6EE"/>
  <!-- Grand Bookshelves -->
  <rect x="60" y="40" width="480" height="260" rx="6" fill="#6D4C41" stroke="#4E342E" stroke-width="4"/>
  <!-- Shelves Dividers -->
  <line x1="60" y1="120" x2="540" y2="120" stroke="#8D6E63" stroke-width="6"/>
  <line x1="60" y1="200" x2="540" y2="200" stroke="#8D6E63" stroke-width="6"/>

  <!-- Shelf 1 Books -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="18" height="65" fill="#D32F2F" rx="2"/>
    <rect x="22" y="5" width="14" height="60" fill="#1976D2" rx="2"/>
    <rect x="40" y="0" width="22" height="65" fill="#388E3C" rx="2"/>
    <rect x="66" y="8" width="16" height="57" fill="#FBC02D" rx="2"/>
    <rect x="86" y="2" width="20" height="63" fill="#7B1FA2" rx="2"/>
    <rect x="110" y="0" width="26" height="65" fill="#00796B" rx="2"/>
    <rect x="140" y="10" width="18" height="55" fill="#E64A19" rx="2"/>
    <rect x="162" y="0" width="16" height="65" fill="#5D4037" rx="2"/>
    <rect x="182" y="4" width="22" height="61" fill="#0288D1" rx="2"/>
  </g>

  <!-- Shelf 2 Books -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="24" height="65" fill="#00612E" rx="2"/>
    <rect x="28" y="6" width="16" height="59" fill="#E6BE1E" rx="2"/>
    <rect x="48" y="0" width="18" height="65" fill="#C2185B" rx="2"/>
    <rect x="70" y="2" width="22" height="63" fill="#512DA8" rx="2"/>
    <rect x="96" y="10" width="15" height="55" fill="#0097A7" rx="2"/>
    <rect x="115" y="0" width="20" height="65" fill="#689F38" rx="2"/>
    <rect x="140" y="4" width="24" height="61" fill="#FFA000" rx="2"/>
  </g>

  <!-- Cozy Reading Chair & Lamp -->
  <g transform="translate(380, 190)">
    <ellipse cx="60" cy="110" rx="45" ry="18" fill="#8D6E63"/>
    <path d="M30,105 C20,70 40,40 60,40 C80,40 100,70 90,105 Z" fill="#00612E"/>
    <!-- Floor Lamp -->
    <line x1="130" y1="30" x2="130" y2="120" stroke="#FFA000" stroke-width="4"/>
    <polygon points="115,30 145,30 140,5 120,5" fill="#FFF9C4"/>
  </g>

  <!-- Flooring -->
  <rect x="0" y="310" width="600" height="90" fill="#EFEBE9"/>
</svg>