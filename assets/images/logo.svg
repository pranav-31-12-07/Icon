<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00612E"/>
      <stop offset="100%" stop-color="#003B1C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="50%" stop-color="#E6BE1E"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="torchGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="60%" stop-color="#F1C40F"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Outer Circular Ring with Academic Gold -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="14 4"/>
  <circle cx="200" cy="200" r="172" fill="#FFFFFF" stroke="#00612E" stroke-width="4"/>

  <!-- Academic Crest Shield -->
  <path d="M200,60 C260,60 300,85 300,165 C300,240 200,295 200,310 C200,295 100,240 100,165 C100,85 140,60 200,60 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Golden Laurel Wreath (Left side) -->
  <path d="M125,180 C110,150 120,110 145,95 M115,195 C98,160 105,125 130,110 M120,215 C105,185 110,150 135,135" 
        stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Golden Laurel Wreath (Right side) -->
  <path d="M275,180 C290,150 280,110 255,95 M285,195 C302,160 295,125 270,110 M280,215 C295,185 290,150 265,135" 
        stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Torch of Knowledge -->
  <path d="M194,155 L206,155 L203,190 L197,190 Z" fill="url(#goldGrad)"/>
  <path d="M190,155 L210,155 L208,160 L192,160 Z" fill="#FFFFFF"/>
  <!-- Flame -->
  <path d="M200,105 C215,125 212,145 200,152 C188,145 185,125 200,105 Z" fill="url(#torchGrad)"/>
  <path d="M200,118 C207,130 205,142 200,146 C195,142 193,130 200,118 Z" fill="#FFFFFF" opacity="0.85"/>

  <!-- Open Book of Wisdom -->
  <path d="M150,210 C175,200 200,205 200,215 C200,205 225,200 250,210 L250,235 C225,225 200,230 200,240 C200,230 175,225 150,235 Z" 
        fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M200,215 L200,240" stroke="#00612E" stroke-width="2"/>
  <!-- Book text lines -->
  <line x1="162" y1="218" x2="190" y2="216" stroke="#00612E" stroke-width="2"/>
  <line x1="162" y1="225" x2="190" y2="223" stroke="#00612E" stroke-width="2"/>
  <line x1="210" y1="216" x2="238" y2="218" stroke="#00612E" stroke-width="2"/>
  <line x1="210" y1="223" x2="238" y2="225" stroke="#00612E" stroke-width="2"/>

  <!-- Stars of Excellence -->
  <polygon points="200,75 203,83 211,83 205,88 207,96 200,91 193,96 195,88 189,83 197,83" fill="url(#goldGrad)"/>
  <polygon points="160,88 162,94 168,94 163,98 165,104 160,100 155,104 157,98 152,94 158,94" fill="url(#goldGrad)"/>
  <polygon points="240,88 242,94 248,94 243,98 245,104 240,100 235,104 237,98 232,94 238,94" fill="url(#goldGrad)"/>

  <!-- Academic Ribbon Banner at Bottom -->
  <path d="M75,325 L120,310 L150,325 L250,325 L280,310 L325,325 L310,355 L280,342 L200,348 L120,342 L90,355 Z" 
        fill="url(#goldGrad)" stroke="#8B6508" stroke-width="2"/>
  <text x="200" y="338" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#0A0A0A" text-anchor="middle" letter-spacing="1.5">ICON ENGLISH SCHOOL</text>
  <text x="200" y="375" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#00612E" text-anchor="middle" letter-spacing="2">CHHATRAPATI SAMBHAJINAGAR</text>
</svg>

