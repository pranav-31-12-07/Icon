<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#E8F5E9"/>
  <!-- Sports Ground Turf -->
  <rect x="0" y="160" width="600" height="240" fill="#43A047"/>
  <!-- Track Lines -->
  <path d="M0,260 C200,240 400,240 600,260" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-dasharray="12 8"/>
  <path d="M0,320 C200,300 400,300 600,320" stroke="#FFFFFF" stroke-width="4" fill="none"/>

  <!-- Football / Soccer Ball -->
  <g transform="translate(130, 220)">
    <circle cx="35" cy="35" r="32" fill="#FFFFFF" stroke="#212121" stroke-width="3"/>
    <polygon points="35,20 45,28 41,40 29,40 25,28" fill="#212121"/>
    <line x1="35" y1="20" x2="35" y2="5" stroke="#212121" stroke-width="2"/>
    <line x1="45" y1="28" x2="60" y2="24" stroke="#212121" stroke-width="2"/>
    <line x1="41" y1="40" x2="52" y2="55" stroke="#212121" stroke-width="2"/>
    <line x1="29" y1="40" x2="18" y2="55" stroke="#212121" stroke-width="2"/>
    <line x1="25" y1="28" x2="10" y2="24" stroke="#212121" stroke-width="2"/>
  </g>

  <!-- Cricket Bat & Wickets -->
  <g transform="translate(360, 170)">
    <!-- Wickets -->
    <line x1="110" y1="50" x2="110" y2="120" stroke="#D7CCC8" stroke-width="4"/>
    <line x1="120" y1="50" x2="120" y2="120" stroke="#D7CCC8" stroke-width="4"/>
    <line x1="130" y1="50" x2="130" y2="120" stroke="#D7CCC8" stroke-width="4"/>
    <line x1="108" y1="50" x2="132" y2="50" stroke="#D7CCC8" stroke-width="4"/>
    <!-- Cricket Bat -->
    <rect x="75" y="40" width="16" height="70" rx="3" fill="#D7CCC8" transform="rotate(-25, 75, 40)"/>
    <rect x="79" y="15" width="8" height="28" rx="2" fill="#00612E" transform="rotate(-25, 75, 40)"/>
    <!-- Red Cricket Ball -->
    <circle cx="50" cy="115" r="14" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
    <path d="M42,107 C50,115 50,115 58,123" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Golden Sports Trophy -->
  <g transform="translate(260, 60)">
    <path d="M25,30 C5,30 5,60 25,65 L25,45 Z" fill="#E6BE1E"/>
    <path d="M55,30 C75,30 75,60 55,65 L55,45 Z" fill="#E6BE1E"/>
    <path d="M25,20 L55,20 L50,70 C48,80 32,80 30,70 Z" fill="#FFDF00" stroke="#E6BE1E" stroke-width="2"/>
    <rect x="36" y="75" width="8" height="20" fill="#E6BE1E"/>
    <rect x="26" y="95" width="28" height="15" rx="2" fill="#3E2723"/>
    <polygon points="40,35 43,44 52,44 45,50 48,59 40,53 32,59 35,50 28,44 37,44" fill="#FFFFFF"/>
  </g>
</svg>