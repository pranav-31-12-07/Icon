<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F4FBF7"/>
  <!-- Guardian Shield -->
  <g transform="translate(230, 60)">
    <path d="M70,10 C120,10 140,35 140,85 C140,165 70,205 70,215 C70,205 0,165 0,85 C0,35 20,10 70,10 Z" fill="#00612E" stroke="#E6BE1E" stroke-width="6"/>
    <!-- Checkmark Inside Shield -->
    <path d="M42,95 L62,118 L102,68" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CCTV Camera Illustration -->
  <g transform="translate(80, 100)">
    <rect x="0" y="60" width="12" height="40" fill="#455A64"/>
    <rect x="12" y="70" width="30" height="10" fill="#455A64"/>
    <polygon points="35,60 90,40 90,90 35,80" fill="#ECEFF1" stroke="#37474F" stroke-width="2"/>
    <!-- Lens & Red Status LED -->
    <ellipse cx="90" cy="65" rx="5" ry="20" fill="#263238"/>
    <circle cx="50" cy="70" r="3" fill="#D32F2F"/>
  </g>

  <!-- School Bus Transit -->
  <g transform="translate(380, 240)">
    <rect x="0" y="20" width="170" height="70" rx="8" fill="#FBC02D" stroke="#F57F17" stroke-width="2"/>
    <!-- Windows -->
    <rect x="15" y="30" width="30" height="25" rx="3" fill="#E1F5FE"/>
    <rect x="55" y="30" width="30" height="25" rx="3" fill="#E1F5FE"/>
    <rect x="95" y="30" width="30" height="25" rx="3" fill="#E1F5FE"/>
    <rect x="135" y="30" width="25" height="35" rx="3" fill="#E1F5FE"/>
    <!-- Wheels -->
    <circle cx="45" cy="90" r="16" fill="#212121"/>
    <circle cx="45" cy="90" r="7" fill="#EEEEEE"/>
    <circle cx="135" cy="90" r="16" fill="#212121"/>
    <circle cx="135" cy="90" r="7" fill="#EEEEEE"/>
    <!-- Text -->
    <text x="75" y="72" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800" fill="#0A0A0A">SCHOOL BUS</text>
  </g>

  <!-- Safe Ground Grass -->
  <rect x="0" y="330" width="600" height="70" fill="#81C784"/>
</svg>