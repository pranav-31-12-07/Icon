# Netlify Configuration for Icon English School
[build]
  # Since this is a static multi-page site, publish directory is the root
  publish = "."
  # No build command is required
  command = ""

# Legacy .php URL redirects to modern .html
[[redirects]]
  from = "/index.php"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/about.php"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/admission.php"
  to = "/admission.html"
  status = 301

[[redirects]]
  from = "/facilities.php"
  to = "/facilities.html"
  status = 301

[[redirects]]
  from = "/gallery.php"
  to = "/gallery.html"
  status = 301

[[redirects]]
  from = "/management.php"
  to = "/management.html"
  status = 301

[[redirects]]
  from = "/contact.php"
  to = "/contact.html"
  status = 301

# Clean URL aliases (e.g. /about -> /about.html)
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/admission"
  to = "/admission.html"
  status = 200

[[redirects]]
  from = "/facilities"
  to = "/facilities.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/management"
  to = "/management.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

